<!DOCTYPE html>
<html lang="pt">
	<head>
		<meta charset="utf-8">
		<title>Calendário</title>
		<style>
label {
	display: block;
}

.thumbnail {
	height: 3rem;
	display: inline-block;
}

table {
	border-collapse: collapse;
	width: 100%;
	break-after: always;
	page-break-after: always;
}

caption {
	font-size: 2.5rem;
	font-weight: bold;
	text-align: center;
}

caption small {
    display: block;
    font-size: 1rem;
}

caption img {
	height: 8cm;
	display: block;
	margin: 0.25rem auto 1rem;
}

td, th {
	border: 0.0625rem solid black;
	width: 14.28%;
}

th {
	text-align: center;
}

td {
	padding: 0 0.2rem 4rem;
}
		</style>
	</head>
	<body>
		<form id="parametros">
			<label>Ano:
				<input id="ano" type="text">
			</label>
			<fieldset>
				<legend>Imagens dos meses</legend>
				<label>Janeiro:
					<input class="imagem-mes" id="imagem-janeiro" type="text">
					<img src="" alt="Imagem do mês de janeiro" class="thumbnail">
				</label>
				<label>Fevereiro:
					<input class="imagem-mes" id="imagem-fevereiro" type="text">
					<img src="" alt="Imagem do mês de fevereiro" class="thumbnail">
				</label>
				<label>Março:
					<input class="imagem-mes" id="imagem-marco" type="text">
					<img src="" alt="Imagem do mês de março" class="thumbnail">
				</label>
				<label>Abril:
					<input class="imagem-mes" id="imagem-abril" type="text">
					<img src="" alt="Imagem do mês de abril" class="thumbnail">
				</label>
				<label>Maio:
					<input class="imagem-mes" id="imagem-maio" type="text">
					<img src="" alt="Imagem do mês de maio" class="thumbnail">
				</label>
				<label>Junho:
					<input class="imagem-mes" id="imagem-junho" type="text">
					<img src="" alt="Imagem do mês de junho" class="thumbnail">
				</label>
				<label>Julho:
					<input class="imagem-mes" id="imagem-julho" type="text">
					<img src="" alt="Imagem do mês de julho" class="thumbnail">
				</label>
				<label>Agosto:
					<input class="imagem-mes" id="imagem-agosto" type="text">
					<img src="" alt="Imagem do mês de agosto" class="thumbnail">
				</label>
				<label>Setembro:
					<input class="imagem-mes" id="imagem-setembro" type="text">
					<img src="" alt="Imagem do mês de setembro" class="thumbnail">
				</label>
				<label>Outubro:
					<input class="imagem-mes" id="imagem-outubro" type="text">
					<img src="" alt="Imagem do mês de outubro" class="thumbnail">
				</label>
				<label>Novembro:
					<input class="imagem-mes" id="imagem-novembro" type="text">
					<img src="" alt="Imagem do mês de novembro" class="thumbnail">
				</label>
				<label>Dezembro:
					<input class="imagem-mes" id="imagem-dezembro" type="text">
					<img src="" alt="Imagem do mês de dezembro" class="thumbnail">
				</label>
			</fieldset>
			<button id="gerar">Gerar calendário</button>
		</form>
		<script>
            const nomesMeses = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
            const idsMeses = nomesMeses.map((mes) => mes.toLowerCase().replace('ç', 'c'));
            const nomesDias = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
function imagemDoMes(mes) {
	return document.getElementById('imagem-' + idsMeses[mes]).value;
}

function montaCabecalho(tabela, ano, mes) {
    const img = document.createElement('img');
    img.src = imagemDoMes(mes);

    const legenda = document.createElement('caption');
    const anoTexto = document.createElement('small');
    anoTexto.textContent = ano;
    legenda.appendChild(anoTexto);
    legenda.appendChild(document.createTextNode(nomesMeses[mes]));
    legenda.appendChild(img);

    tabela.appendChild(legenda);

    const head = document.createElement('thead');
    const linha = document.createElement('tr');
    head.appendChild(linha);

	for (let i = 0; i < 7; i++) {
        const nomeDia = document.createElement('th');
        nomeDia.textContent = nomesDias[i];
        linha.appendChild(nomeDia);
	}

    tabela.appendChild(head);
}

function preencheVazios(semana, inicio, fim) {
	for (let i = inicio; i < fim; i++) {
		semana.appendChild(document.createElement('td'));
	}
}

function geraMes(ano, mes) {
	let dia = new Date(ano, mes, 1, 12, 0); // ao meio-dia para evitar problemas na hora de andar pelos dias
    const tabela = document.createElement('table');
    montaCabecalho(tabela, ano, mes);

    const dias = document.createElement('tbody');
    tabela.appendChild(dias);

    let semana = document.createElement('tr');
    preencheVazios(semana, 0, dia.getDay());

	while (dia.getMonth() == mes) {
        const celulaDia = document.createElement('td');
        celulaDia.textContent = dia.getDate();
        semana.appendChild(celulaDia);

		dia = new Date(ano, mes, dia.getDate() + 1, 12, 0);
		if (dia.getDay() == 0 && dia.getMonth() == mes) {
            dias.appendChild(semana);
            semana = document.createElement('tr');
		}
	}
	if (dia.getDay() != 0) {
        preencheVazios(semana, dia.getDay(), 7);
        dias.appendChild(semana);
	}
	return tabela;
}

function geraCalendario() {
	const ano = parseInt(document.getElementById('ano').value);
    const meses = [];
	for (let mes = 0; mes < 12; mes++) {
        meses.push(geraMes(ano, mes));
	}
	document.body.innerHTML = '';
    meses.forEach((mes) => document.body.appendChild(mes));
}

function atualizaThumbnail(evento) {
	evento.target.nextElementSibling.src = evento.target.value;
}

document.getElementById('gerar').addEventListener('click', geraCalendario);

const inputImagens = document.querySelectorAll('.imagem-mes');
for (let i = 0; i < inputImagens.length; i++) {
	inputImagens[i].addEventListener('change', atualizaThumbnail);
}
		</script>
	</body>
</html>
